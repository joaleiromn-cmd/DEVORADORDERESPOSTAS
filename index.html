<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comedor de Respostas - SENAI Edition</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #151a24;
      border: 4px solid #0056a3;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(0, 86, 163, 0.5);
    }
    h1 { color: #ffe600; font-size: 24px; }
    p { color: #00d2ff; font-size: 16px; line-height: 1.5; }
    .btn {
      background: #ffe600;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 5px 0 #b3a000;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3a000; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card" id="start-screen">
    <h1>COMEDOR DE RESPOSTAS</h1>
    <p><strong>SENAI Afonso Pena • Assistente Administrativo</strong><br>Equipe: Gustavo, João, Milena, Nanda, Rosmary</p>
    <p>Clique no botão abaixo para iniciar o jogo imediatamente:</p>
    <button class="btn" onclick="iniciarJogo()">INICIAR JOGO</button>
  </div>

  <div class="card hidden" id="game-screen">
    <h1>JOGO INICIADO COM SUCESSO!</h1>
    <p>O ambiente do SENAI liberou a execução corretamente.</p>
    <canvas id="gameCanvas" width="500" height="300" style="background:#000; border:2px solid #0056a3; margin-top:15px;"></canvas>
  </div>

  <script>
    function iniciarJogo() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffe600';
      ctx.font = '20px Arial';
      ctx.fillText("Pac-Man Carregado!", 150, 150);
    }
  </script>

</body>
</html>
